<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravar Múltiplos Arquivos no NFC</title>
    <style>
        body { font-family: sans-serif; margin: 20px; max-width: 500px; }
        .file-box { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        select, input, textarea { width: 100%; margin-bottom: 8px; box-sizing: border-box; }
        textarea { height: 60px; }
        button { padding: 10px; cursor: pointer; margin-right: 5px; }
        .info { margin: 15px 0; font-size: 0.9em; }
        .danger { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        #log { background: #eee; padding: 10px; margin-top: 15px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <h2>Criar Pacote de Arquivos</h2>
    <div id="filesContainer"></div>

    <button id="addFileBtn">+ Adicionar Arquivo</button>

    <div class="info">
        Tamanho Total Combinado: <span id="byteCount">0</span> / 132 bytes úteis
        <div id="warning" class="success">Cabe no chip!</div>
    </div>

    <button id="writeBtn" style="background:#28a745; color:white; font-weight:bold;">Salvar Todos no NFC</button>

    <h3>Status:</h3>
    <div id="log">Aguardando ações...</div>

    <script>
        const container = document.getElementById('filesContainer');
        const byteCountSpan = document.getElementById('byteCount');
        const warningDiv = document.getElementById('warning');
        const writeBtn = document.getElementById('writeBtn');
        const logDiv = document.getElementById('log');

        const MAX_BYTES = 132;

        function getByteSize(str) {
            return new TextEncoder().encode(str).length;
        }

        function buildDataString() {
            const boxes = document.querySelectorAll('.file-box');
            let partes = [];
            
            boxes.forEach(box => {
                const name = box.querySelector('.file-name').value || "arq";
                const type = box.querySelector('.file-type').value;
                const content = box.querySelector('.file-content').value || "";
                // Formato: nome::tipo::conteúdo
                partes.push(`${name}::${type}::${content}`);
            });

            // Une todos os arquivos usando || como separador
            return partes.join('||');
        }

        function validarTamanho() {
            const stringFinal = buildDataString();
            const size = getByteSize(stringFinal);
            byteCountSpan.textContent = size;

            if (size > MAX_BYTES) {
                warningDiv.textContent = "Atenção: O total de todos os arquivos passou do limite do chip!";
                warningDiv.className = "danger";
                writeBtn.disabled = true;
            } else {
                warningDiv.textContent = "Cabe no chip!";
                warningDiv.className = "success";
                writeBtn.disabled = false;
            }
        }

        function createFileForm() {
            const div = document.createElement('div');
            div.className = 'file-box';
            div.innerHTML = `
                <input type="text" placeholder="Nome do arquivo (curto)" class="file-name" required>
                <select class="file-type">
                    <option value="text">Texto Puro</option>
                    <option value="html">HTML</option>
                    <option value="script">Script JS</option>
                </select>
                <textarea placeholder="Conteúdo..." class="file-content"></textarea>
                <button type="button" class="remove-btn" style="background:#dc3545; color:white; padding:3px 8px; font-size:0.8em;">Remover</button>
            `;
            
            // Ouvintes de evento para recalcular o tamanho a cada alteração
            div.querySelector('.file-name').addEventListener('input', validarTamanho);
            div.querySelector('.file-type').addEventListener('change', validarTamanho);
            div.querySelector('.file-content').addEventListener('input', validarTamanho);
            
            div.querySelector('.remove-btn').addEventListener('click', () => {
                div.remove();
                validarTamanho();
            });

            container.appendChild(div);
            validarTamanho();
        }

        // Inicializa com o primeiro arquivo na tela
        createFileForm();
        document.getElementById('addFileBtn').addEventListener('click', createFileForm);

        writeBtn.addEventListener('click', async () => {
            if (!('NDEFReader' in window)) {
                alert("Web NFC não suportada.");
                return;
            }

            try {
                const dadosParaGravar = buildDataString();
                logDiv.textContent = "Aproxime o chip NFC para salvar o pacote...";
                
                const ndef = new NDEFReader();
                await ndef.write({
                    records: [{ recordType: "text", data: dadosParaGravar }]
                });

                logDiv.textContent = "🎉 Todos os arquivos foram salvos juntos dentro do chip!";
            } catch (error) {
                logDiv.textContent = `Erro ao salvar: ${error}`;
            }
        });
    </script>
</body>
</html>
