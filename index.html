<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravar NFC</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        textarea { width: 100%; height: 120px; }
        .info { margin: 10px 0; font-size: 0.9em; }
        .danger { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        button { padding: 12px; cursor: pointer; }
        #log { background: #eee; padding: 10px; margin-top: 15px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <h2>Escrita - NXP Ultralight</h2>
    
    <textarea id="content" placeholder="Insira o texto ou HTML curto..."></textarea>
    
    <div class="info">
        Bytes: <span id="byteCount">0</span> / 132 bytes úteis
        <div id="warning" class="success">Cabe no chip!</div>
    </div>

    <button id="writeBtn">Salvar no NFC</button>

    <h3>Status:</h3>
    <div id="log">Aguardando comando...</div>

    <script>
        const contentArea = document.getElementById('content');
        const byteCountSpan = document.getElementById('byteCount');
        const warningDiv = document.getElementById('warning');
        const writeBtn = document.getElementById('writeBtn');
        const logDiv = document.getElementById('log');

        const MAX_BYTES = 132; 

        function getByteSize(str) {
            return new TextEncoder().encode(str).length;
        }

        contentArea.addEventListener('input', () => {
            const size = getByteSize(contentArea.value);
            byteCountSpan.textContent = size;

            if (size > MAX_BYTES) {
                warningDiv.textContent = "Atenção: Não vai caber no chip NXP Ultralight!";
                warningDiv.className = "danger";
                writeBtn.disabled = true;
            } else {
                warningDiv.textContent = "Cabe no chip!";
                warningDiv.className = "success";
                writeBtn.disabled = false;
            }
        });

        writeBtn.addEventListener('click', async () => {
            if (!('NDEFReader' in window)) {
                alert("Web NFC não suportada (Use o Chrome no Android via HTTPS).");
                return;
            }

            try {
                logDiv.textContent = "Aproxime o chip NFC para salvar...";
                const ndef = new NDEFReader();
                
                await ndef.write({
                    records: [{ recordType: "text", data: contentArea.value }]
                });

                logDiv.textContent = "🎉 Salvo com sucesso no NXP Ultralight!";
            } catch (error) {
                logDiv.textContent = `Erro ao salvar: ${error}`;
            }
        });
    </script>
</body>
</html>
