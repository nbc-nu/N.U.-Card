<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Text Storage</title>
    <style>
        body { font-family: sans-serif; margin: 20px; max-width: 500px; }
        textarea { width: 100%; height: 150px; margin-bottom: 5px; }
        .info { font-size: 0.9em; margin-bottom: 15px; }
        .danger { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        button { padding: 10px; margin-right: 10px; cursor: pointer; }
        #log { background: #f0f0f0; padding: 10px; margin-top: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>Gravar Texto/HTML no NFC</h2>
    
    <!-- Área para digitar o conteúdo -->
    <textarea id="content" placeholder="Cole aqui seu HTML ou Texto..."></textarea>
    
    <!-- Validador de Espaço -->
    <div class="info">
        Tamanho: <span id="byteCount">0</span> / 144 bytes (Limite padrão NTAG213)
        <div id="warning" class="success">Cabe no chip!</div>
    </div>

    <!-- Controles -->
    <button id="writeBtn">Salvar no NFC</button>
    <button id="readBtn">Visualizar/Ler NFC</button>

    <h3>Resultado da Leitura:</h3>
    <div id="log">Nenhum dado lido ainda.</div>

    <script>
        const contentArea = document.getElementById('content');
        const byteCountSpan = document.getElementById('byteCount');
        const warningDiv = document.getElementById('warning');
        const writeBtn = document.getElementById('writeBtn');
        const readBtn = document.getElementById('readBtn');
        const logDiv = document.getElementById('log');

        // Limite estimado para tags baratas (NTAG213). Se usar NTAG216, mude para 888.
        const MAX_BYTES = 144; 

        // Função para calcular bytes reais do texto (UTF-8)
        function getByteSize(str) {
            return new TextEncoder().encode(str).length;
        }

        // Monitora o que o usuário digita e valida o espaço
        contentArea.addEventListener('input', () => {
            const size = getByteSize(contentArea.value);
            byteCountSpan.textContent = size;

            if (size > MAX_BYTES) {
                warningDiv.textContent = "Atenção: Não vai caber no chip padrão (NTAG213)!";
                warningDiv.className = "danger";
                writeBtn.disabled = true;
            } else {
                warningDiv.textContent = "Cabe no chip!";
                warningDiv.className = "success";
                writeBtn.disabled = false;
            }
        });

        // 1. COMO GRAVAR O CONTEÚDO
        writeBtn.addEventListener('click', async () => {
            if (!('NDEFReader' in window)) {
                alert("Web NFC não suportada neste navegador (use Chrome no Android).");
                return;
            }

            try {
                logDiv.textContent = "Aproxime a tag NFC para GRAVAR...";
                const ndef = new NDEFReader();
                
                // Grava o texto puro (pode ser HTML text)
                await ndef.write({
                    records: [{ recordType: "text", data: contentArea.value }]
                });

                logDiv.textContent = "🎉 Sucesso! Conteúdo salvo na tag NFC.";
            } catch (error) {
                logDiv.textContent = `Erro ao gravar: ${error}`;
            }
        });

        // 2. COMO VISUALIZAR / LER O CONTEÚDO
        readBtn.addEventListener('click', async () => {
            if (!('NDEFReader' in window)) {
                alert("Web NFC não suportada neste navegador.");
                return;
            }

            try {
                logDiv.textContent = "Aproxime a tag NFC para LER...";
                const ndef = new NDEFReader();
                await ndef.scan(); // Ativa o modo de escuta do leitor

                ndef.addEventListener("reading", ({ message }) => {
                    const decoder = new TextDecoder();
                    logDiv.textContent = ""; // Limpa o aviso de aproximação

                    for (const record of message.records) {
                        if (record.recordType === "text") {
                            const textoLido = decoder.decode(record.data);
                            
                            // Mostra o texto bruto no log
                            logDiv.innerText = "Texto lido:\n" + textoLido;
                            
                            // Se for um HTML e você quiser renderizar visualmente na página:
                            // crie um elemento e injete: document.body.innerHTML += textoLido;
                        } else {
                            logDiv.textContent = "A tag contém um tipo de dado diferente de texto.";
                        }
                    }
                });

            } catch (error) {
                logDiv.textContent = `Erro ao ler: ${error}`;
            }
        });
    </script>
</body>
</html>
