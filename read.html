<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor NFC Avançado</title>
    <style>
        body { font-family: sans-serif; margin: 20px; display: flex; flex-direction: column; height: 90vh; }
        button { padding: 15px; cursor: pointer; width: 100%; font-size: 1.2em; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:active { background: #0056b3; }
        #view { flex-grow: 1; margin-top: 20px; padding: 15px; border: 2px dashed #ccc; background: #fafafa; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

    <button id="readBtn">Escanear NFC</button>

    <div id="view">Aguardando leitura do chip...</div>

    <script>
        const readBtn = document.getElementById('readBtn');
        const view = document.getElementById('view');

        readBtn.addEventListener('click', async () => {
            if (!('NDEFReader' in window)) {
                alert("Web NFC não suportada (Use o Chrome no Android via HTTPS).");
                return;
            }

            try {
                view.innerHTML = "<b>Aproxime o chip para ler...</b>";
                
                const ndef = new NDEFReader();
                await ndef.scan();

                ndef.addEventListener("reading", ({ message }) => {
                    const decoder = new TextDecoder();

                    for (const record of message.records) {
                        if (record.recordType === "text") {
                            const conteudo = decoder.decode(record.data);
                            
                            // Limpa a tela antes de processar
                            view.innerHTML = "";
                            view.textContent = "";

                            // 1. Condicional para HTML
                            if (conteúdo.startsWith("{html}=")) {
                                const htmlPuro = conteúdo.replace("{html}=", "");
                                view.innerHTML = htmlPuro;
                            } 
                            
                            // 2. Condicional para JavaScript (Script)
                            else if (conteúdo.startsWith("{script}=")) {
                                const jsPuro = conteúdo.replace("{script}=", "");
                                view.innerHTML = "<i>Executando script gravado no chip...</i>";
                                try {
                                    // Executa o script de forma segura no contexto global
                                    const rodarScript = new Function(jsPuro);
                                    rodarScript();
                                } catch (e) {
                                    view.innerHTML = `<span style="color:red">Erro no script: ${e.message}</span>`;
                                }
                            } 
                            
                            // 3. Condicional para Texto Puro ou caso não tenha prefixo conhecido
                            else if (conteúdo.startsWith("{text}=")) {
                                const textoPuro = conteúdo.replace("{text}=", "");
                                view.textContent = textoPuro;
                            } 
                            
                            // Fallback caso não use nenhum padrão
                            else {
                                view.textContent = conteúdo;
                            }
                            
                        } else {
                            view.textContent = "A tag contém dados que não são texto.";
                        }
                    }
                });

            } catch (error) {
                view.innerHTML = `<span style="color:red">Erro: ${error.message || error}</span>`;
            }
        });
    </script>
</body>
</html>
